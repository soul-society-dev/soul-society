<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A0C16'/%3E%3Ccircle cx='40' cy='24' r='12' fill='%23E9ECF5'/%3E%3Cpath d='M0 64V48l8-4 8 8 8-14 8 12 8-8 24 10v12z' fill='%23D9A441'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0A0C16">
<title>Anime Trivia – Soul Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A0C16;--ink:#E9ECF5;--card:#131728;--muted:#A0A7C4;--line:#262B45;--blue:#5AB7FF;--gold:#D9A441;--red:#FF6A73;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C16;--ink:#E9ECF5;--card:#131728;--muted:#A0A7C4;--line:#262B45;--blue:#5AB7FF;--gold:#D9A441}}
:root[data-theme="dark"]{--bg:#0A0C16;--ink:#E9ECF5;--card:#131728;--muted:#A0A7C4;--line:#262B45;--blue:#5AB7FF;--gold:#D9A441}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Shippori Mincho B1","Hiragino Mincho ProN",Georgia,serif;font-weight:800;line-height:1.15;margin:0}
a{color:inherit}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}.narrow{max-width:700px}

/* header */
.top{position:sticky;top:0;z-index:20;background:#0A0C16;color:#E9ECF5;border-bottom:1px solid #262B45}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.logo{font-family:"Cinzel Decorative","Shippori Mincho B1",Georgia,serif;font-weight:900;font-size:1.1rem;text-decoration:none;letter-spacing:.08em}
.top nav{display:flex;gap:28px;align-items:center;font-size:.95rem}
.top nav a{text-decoration:none;color:#A0A7C4;padding:4px 0;border-bottom:2px solid transparent}
.top nav a:hover{color:#5AB7FF}
.top nav a[aria-current="page"]{color:#E9ECF5;border-bottom-color:#D9A441}
.top nav a.cta-link{background:#D9A441;color:#12152A;padding:8px 16px;border-radius:2px;font-weight:700;border-bottom:0}
.menu{display:none;background:transparent;color:#E9ECF5;border:1px solid #262B45;padding:8px 16px;font:inherit;border-radius:2px;cursor:pointer}

/* hero and page heads */
.hero,.phead{position:relative;background:linear-gradient(#0A0C16 0%,#1A2250 55%,#3B4F8F 100%);color:#E9ECF5;overflow:hidden}
.hero{min-height:520px;display:flex;align-items:center}
.phead{padding:64px 0 120px}
.sky{position:absolute;left:0;bottom:0;width:100%;height:46%;min-height:170px}
.hero>.wrap,.phead>.wrap{position:relative;z-index:2}
.hero>.wrap{padding-top:56px;padding-bottom:160px}
.hero h1{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;font-size:clamp(1.9rem,7.5vw,5rem);letter-spacing:.06em;background:linear-gradient(180deg,#fff 15%,#D9A441 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(90,183,255,.45))}
.phead h1{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;font-size:clamp(1.6rem,6vw,3rem);letter-spacing:.05em;color:#fff}
.tag{font-family:"Shippori Mincho B1",Georgia,serif;font-size:clamp(1rem,3vw,1.35rem);color:#D9A441;margin:12px 0 14px}
.hero p,.phead p{max-width:34em;color:#C9CFE3;margin:0 0 24px}
.phead p{margin:10px 0 0}
.btn{display:inline-block;font:inherit;font-weight:700;background:#D9A441;color:#12152A;border:0;padding:13px 24px;text-decoration:none;cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:#E9ECF5;border:2px solid #5AB7FF;margin-left:8px}
.btn:hover{filter:brightness(1.1)}
.spirits{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.spirit{position:absolute;bottom:-10px;border-radius:50%;background:#7FD0FF;box-shadow:0 0 10px 3px rgba(90,183,255,.7);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-460px);opacity:0}}
.moon{animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{opacity:.7}}

/* sections */
section{padding:80px 0 0}
main>section:last-of-type{padding-bottom:96px}
section>.wrap>h2{font-size:clamp(1.6rem,4.5vw,2.3rem);margin-bottom:8px}
.sub{color:var(--muted);max-width:42em;margin:0 0 32px}
.lead{font-size:1.15rem;color:var(--muted);margin:0}
.h3{font-size:1.1rem;margin:0 0 16px}
.more{display:inline-block;margin-top:20px;font-weight:700;color:var(--blue);text-decoration:none}
.more:hover{text-decoration:underline}

/* door tiles on the home page */
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.door{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;min-height:200px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);padding:28px 24px 24px;text-decoration:none;transition:transform .2s,border-color .2s}
.door:hover{transform:translateY(-4px);border-color:var(--c)}
.door .kj{position:absolute;right:12px;top:-4px;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:5.5rem;opacity:.12;line-height:1;pointer-events:none}
.door h3{font-size:1.3rem}.door p{margin:0;color:var(--muted);flex:1}
.go{color:var(--c);font-weight:700;font-size:.9rem}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{border:2px solid var(--c);background:var(--card);color:var(--ink);padding:6px 16px;border-radius:99px;text-decoration:none;font-weight:700;font-size:.92rem}
.pill:hover{background:var(--c);color:#12152A}
.cta{background:#0A0C16;color:#E9ECF5;text-align:center;padding:64px 22px}
.cta h2{font-size:clamp(1.6rem,5vw,2.4rem)}.cta p{color:#A0A7C4;max-width:34em;margin:10px auto 24px}

/* cards and grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.soc{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);padding:24px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.soc:hover{border-color:var(--c)}
.soc h3{font-size:1.1rem}.soc p{margin:0;color:var(--muted);font-size:.93rem;flex:1}
.soc.locked{border-style:dashed}
.badge{align-self:flex-start;font-size:.8rem;font-weight:700;border:1px solid var(--c);color:var(--c);padding:1px 8px;border-radius:99px}
.soc .go{margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.feedlist,.evlist{display:grid;gap:14px}
.fi{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);padding:14px 18px;text-decoration:none;color:inherit}
.fi:hover{border-color:var(--c)}.fi b{display:block}.fi span{color:var(--muted);font-size:.92rem}
.ev{background:var(--card);border:1px solid var(--line);padding:18px 20px}
.ev .d{font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;font-size:1.5rem;color:var(--red)}
.ev h3{font-size:1.05rem}.ev p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.ent4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.ecard{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);padding:26px 22px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:transform .2s,border-color .2s}
.ecard:hover{border-color:var(--c);transform:translateY(-4px)}
.ecard p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.tagc{font-size:.78rem;font-weight:700;color:var(--gold)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips span{border:1px solid var(--line);background:var(--card);padding:6px 16px;border-radius:99px;font-size:.92rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);padding:20px;counter-increment:s}
.step::before{content:counter(s);display:block;font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;font-size:1.8rem;color:var(--red)}
.step b{display:block;margin:4px 0}.step span{color:var(--muted);font-size:.93rem}

/* join form */
.joinbox{background:#0A0C16;color:#E9ECF5;padding:36px 24px;max-width:560px;margin:0 auto}
.joinbox h2{margin-bottom:8px}.joinbox p{color:#A0A7C4;margin:0 0 20px}
.joinbox form{display:grid;gap:10px;text-align:left}
.joinbox input,.joinbox textarea{font:inherit;padding:12px;border:1px solid #262B45;background:#131728;color:#E9ECF5;width:100%}
.joinbox textarea{min-height:80px}
.joinbox fieldset{border:1px solid #262B45;padding:10px 12px;margin:0}
.joinbox legend{color:#A0A7C4;padding:0 6px}
.chk{display:flex;gap:10px;align-items:center;padding:4px 0}
.joinbox input[type=checkbox]{width:auto;flex:none;padding:0}
#ok{min-height:1.6em;margin-top:14px;color:#D9A441;font-weight:700}

/* footer */
.foot{border-top:1px solid var(--line);padding:32px 22px 40px;text-align:center;color:var(--muted);font-size:.88rem}
.foot nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.foot a{text-decoration:none}.foot a:hover{color:var(--blue)}
.foot p{max-width:620px;margin:0 auto}

@media (max-width:760px){
  .menu{display:block}
  .top nav{display:none;width:100%;flex-direction:column;align-items:stretch;gap:0;padding-top:6px}
  .top nav.open{display:flex}
  .top nav a{padding:15px 4px;border-top:1px solid #262B45;border-bottom:0;font-size:1.05rem}
  .top nav a.cta-link{margin-top:10px;text-align:center}
  .two{grid-template-columns:1fr;gap:36px}
  section{padding-top:64px}
  .btn.ghost{margin:10px 0 0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.spirit,.moon{animation:none}.spirit{opacity:.6;bottom:auto;top:var(--ty,50%)}
  .door,.ecard{transition:none}.door:hover,.ecard:hover{transform:none}
}

/* home announcement spotlight */
.spot{background:#0A0C16;color:#E9ECF5;border-top:5px solid #FF7A59;padding:40px 24px;text-align:center}
.spot .label{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#D9A441;margin-bottom:10px}
.spot h2{font-size:clamp(1.5rem,5vw,2.3rem);margin-bottom:10px}
.spot p{color:#A0A7C4;max-width:34em;margin:0 auto 22px}
.vsrow{display:flex;justify-content:center;align-items:center;gap:24px;margin:0 0 26px}
.vsrow div{font-weight:700}.vsrow svg{display:block;width:84px;height:84px;margin:0 auto 6px}
.vsrow i{font-style:normal;font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;color:#C8323C;font-size:1.5rem}

.emb{display:block;width:52px;height:52px;color:var(--c);margin-bottom:8px}.emb svg{width:100%;height:100%;display:block}
.tbox{background:var(--card);border:1px solid var(--line);border-top:5px solid #7BD88F;padding:26px 22px}
.tbox[hidden]{display:none}
.tmeta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin-bottom:10px}
.timer{height:8px;background:var(--line);margin-bottom:20px}.timer span{display:block;height:100%;width:100%;background:#7BD88F}
.qt{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:1.3rem;margin-bottom:18px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin:0 0 10px;background:var(--bg);color:var(--ink);border:2px solid var(--line);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:#7BD88F;background:rgba(123,216,143,.14)}
.opt.no{border-color:#FF6A73;background:rgba(255,106,115,.14)}
.lbrow{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);padding:12px 16px;margin-bottom:8px}
.lbrow .rk{font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;color:var(--gold);width:28px}
.lbrow .nm{flex:1;font-weight:700}.lbrow .pt{color:var(--muted);font-weight:700}
</style>
</head>
<body data-page="games">
<div id="hdr"></div>
<div class="phead"><div class="wrap"><h1>Anime Trivia</h1><p>10 questions. 15 seconds each. Faster answers score more.</p></div></div>
<main>
<section><div class="wrap narrow">
  <div id="start" class="tbox">
    <h2>Ready?</h2>
    <p class="sub" style="margin-bottom:20px">Each correct answer scores 10 points plus up to 5 bonus points for speed. The best possible score is 150.</p>
    <button class="btn" id="go" type="button" style="border:0;cursor:pointer">Start the quiz</button>
    <p class="sub" id="who" style="margin:18px 0 0"></p>
  </div>
  <div id="play" class="tbox" hidden>
    <div class="tmeta"><span id="qn"></span><span id="sc"></span></div>
    <div class="timer"><span id="tb"></span></div>
    <h2 id="qt" class="qt"></h2>
    <div id="opts"></div>
  </div>
  <div id="done" class="tbox" hidden>
    <h2 id="dt"></h2>
    <p class="lead" id="dd" style="margin-bottom:12px"></p>
    <p class="sub" id="ds" role="status"></p>
    <button class="btn" id="again" type="button" style="border:0;cursor:pointer">Play again</button>
  </div>
</div></section>
<section><div class="wrap narrow">
  <h2>Top players</h2>
  <p class="sub">Best score for each player.</p>
  <div id="lb"><p class="sub">Loading…</p></div>
</div></section>
</main>
<div id="ftr"></div>
<script>
(function(){
const SB="https://fehrldvrjgbkuqgrhjmg.supabase.co",APIKEY="sb_publishable_ihQ-c89K2hsj1w0bwDh8fA_67q3EIzP";
const S=[
 ["Anime Hub","Series, characters, recommendations and anime talk.","#5AB7FF"],
 ["Hentai Paradise","Members 18+ only. Access after verification.","#C8323C","18+"],
 ["Gamers Society","Game talk, competitions and finding players.","#7BD88F"],
 ["CineRealm","Movies and TV: reviews, picks and discussion.","#D9A441"],
 ["NovelUp Book Club","Share books, discuss stories, join reading activities.","#B58CFF"],
 ["SS Battle Ground","Compare anime characters, debate and vote on who wins.","#FF7A59"],
 ["Music Society","Recommendations, artists and karaoke sessions.","#FF6FAE"],
 ["MMM Society","Manga, manhwa and manhua: lists, reviews, chapter talk.","#4DD0C4"]
];
const F=[["Anime Hub","New anime recommendation posted."],["Gamers Society","A multiplayer room is open."],["Music Society","Karaoke begins Saturday."],["SS Battle Ground","Gojo vs Sukuna voting is underway."],["MMM Society","New reading challenge announced."]];
const SIGNED=(()=>{try{return !!JSON.parse(localStorage.getItem("ss-member")||sessionStorage.getItem("ss-member")||"null")}catch(e){return false}})();
const NAV=[["index.html","Home","home"],["societies.html","Societies","societies"],["happening.html","What\u2019s happening","happening"],["entertainment.html","Entertainment","entertainment"],["member.html",SIGNED?"My account":"Log in","member"],["join.html","Join","join"]];
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-");
const $=id=>document.getElementById(id);
const page=document.body.dataset.page||"";

/* header and footer */
const h=$("hdr");
if(h)h.outerHTML=`<header class="top"><div class="wrap"><a class="logo" href="index.html">Soul Society</a>
<button class="menu" id="menuBtn" aria-expanded="false" aria-controls="nav" type="button">Menu</button>
<nav id="nav" aria-label="Main">${NAV.map(n=>`<a href="${n[0]}"${n[2]===page?' aria-current="page"':""}${n[2]==="join"?' class="cta-link"':""}>${n[1]}</a>`).join("")}</nav></div></header>`;
const f=$("ftr");
if(f)f.outerHTML=`<footer class="foot"><nav aria-label="Footer">${NAV.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join("")}</nav><p>Soul Society is an independent fan community. It is not affiliated with or endorsed by any studio, publisher or rights holder.</p></footer>`;
const mb=$("menuBtn"),nv=$("nav");
if(mb){
  mb.onclick=()=>{const o=nv.classList.toggle("open");mb.setAttribute("aria-expanded",String(o))};
  nv.addEventListener("click",e=>{if(e.target.closest("a")){nv.classList.remove("open");mb.setAttribute("aria-expanded","false")}});
}

/* skyline and spirit lights */
const SKY=`<svg class="sky" viewBox="0 0 1200 260" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"><circle class="moon" cx="930" cy="40" r="70" fill="#E9ECF5" opacity=".92"/><path d="M0 260V190l60-8 40-40 40 40h50v-30l30-20 30 20v30h70l50-50 50 50h60v-60l40-30 40 30v60h90v-90l25-18 25-18 25 18 25 18v108h70l45-45 45 45h80v-40l30-25 30 25v40h60l40-60 40 60h80V260z" fill="#12163A" opacity=".75"/><path d="M0 260v-46h90l50-36 50 36h60v-20h40l50-40 50 40h90v-70h14V70l10-22 10 22v52h14v70h86l60-52 60 52h60v-28h60l50-38 50 38h90v-40l40-30 40 30v40h120l50-30 50 30h40v46z" fill="#070914"/></svg>`;
document.querySelectorAll(".hero,.phead").forEach(el=>{
  el.insertAdjacentHTML("afterbegin",SKY);
  const sp=document.createElement("div");sp.className="spirits";sp.setAttribute("aria-hidden","true");
  const n=el.classList.contains("hero")?24:12;
  for(let i=0;i<n;i++){
    const e=document.createElement("span");e.className="spirit";const z=3+Math.random()*4;
    e.style.cssText=`--ty:${(20+Math.random()*60)|0}%;left:${Math.random()*100}%;width:${z}px;height:${z}px;--dx:${(Math.random()*120-60)|0}px;animation-duration:${7+Math.random()*8}s;animation-delay:-${Math.random()*12}s`;
    if(i%4===0){e.style.background="#D9A441";e.style.boxShadow="0 0 10px 3px rgba(217,164,65,.7)"}
    sp.appendChild(e);
  }
  el.appendChild(sp);
});

/* societies */
if($("socGrid"))$("socGrid").innerHTML=S.map(s=>`<a class="soc${s[3]?" locked":""}" style="--c:${s[2]}" href="society.html?s=${slug(s[0])}"><span class="emb" data-emb="${slug(s[0])}"></span><h3>${s[0]}</h3><p>${s[1]}</p>${s[3]?'<span class="badge">Age-restricted</span>':""}<span class="go">Enter society</span></a>`).join("");
if($("socPills"))$("socPills").innerHTML=S.map(s=>`<a class="pill" style="--c:${s[2]}" href="society.html?s=${slug(s[0])}">${s[0]}</a>`).join("");

/* activity feed */
const fl=$("feedList");
if(fl){
  const lim=+fl.dataset.limit||F.length;
  fl.innerHTML=F.slice(0,lim).map(x=>{const c=S.find(s=>s[0]===x[0])[2];return `<a class="fi" style="--c:${c}" href="society.html?s=${slug(x[0])}"><div><b>${x[0]}</b><span>${x[1]}</span></div></a>`}).join("");
}

/* join form */
const jf=$("jf");
if(jf){
  $("pick").innerHTML=S.map(s=>`<label class="chk"><input type="checkbox" value="${s[0]}"> ${s[0]}</label>`).join("");
  jf.addEventListener("submit",async e=>{
    e.preventDefault();
    const ok=$("ok"),soc=[...document.querySelectorAll("#pick input:checked")].map(x=>x.value);
    if(soc.includes("Hentai Paradise")&&!$("ad").checked){ok.textContent="The 18+ society is for adults only. Tick the 18+ box to apply for it, or untick it.";return}
    const b=jf.querySelector("button");b.disabled=true;ok.textContent="Sending\u2026";
    try{
      const r=await fetch(SB+"/rest/v1/applications",{method:"POST",headers:{apikey:APIKEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({full_name:$("nm").value.trim(),email:$("em").value.trim(),societies:soc,is_adult:$("ad").checked,note:$("nt").value.trim()||null})});
      if(!r.ok)throw new Error(r.status);
      ok.textContent="Application received. An administrator will review it and contact you by email.";jf.reset();
    }catch(err){ok.textContent="Could not send your application. Check your connection and try again."}
    b.disabled=false;
  });
}
})();

const $=id=>document.getElementById(id);

const TIME=15,ROUND=10;
let order=[],qi=0,score=0,right=0,left=TIME,timer=null,locked=false;

let _ses=null;
const getSes=()=>_ses||(_ses=(async()=>{
  try{
    let bucket=localStorage,raw=localStorage.getItem(SK);
    if(!raw){bucket=sessionStorage;raw=sessionStorage.getItem(SK)}
    if(!raw)return null;
    const rt=JSON.parse(raw).rt;if(!rt)return null;
    const r=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})});

function show(id){["start","play","done"].forEach(x=>$(x).hidden=x!==id)}
function start(){
  order=shuffle(Q.map((_,i)=>i)).slice(0,ROUND);qi=0;score=0;right=0;
  show("play");next();
}
function next(){
  if(qi>=order.length){finish();return}
  const q=Q[order[qi]];
  const items=shuffle(q[1].map((t,i)=>({t,c:i===q[2]})));
  locked=false;left=TIME;
  $("qn").textContent="Question "+(qi+1)+" of "+ROUND;
  $("sc").textContent="Score: "+score;
  $("qt").textContent=q[0];

  $("tb").style.width="100%";
  clearInterval(timer);
  timer=setInterval(()=>{
    left-=0.1;
    $("tb").style.width=Math.max(0,left/TIME*100)+"%";
    if(left<=0){clearInterval(timer);answer(null)}
  },100);
}
function answer(btn){
  if(locked)return;locked=true;clearInterval(timer);
  document.querySelectorAll("#opts .opt").forEach(b=>{b.disabled=true;if(b.dataset.c==="1")b.classList.add("ok")});
  if(btn){
    if(btn.dataset.c==="1"){const pts=10+Math.ceil(Math.max(0,left)/3);score+=pts;right++;$("sc").textContent="Score: "+score}
    else btn.classList.add("no");
  }
  setTimeout(()=>{qi++;next()},1300);
}
$("opts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)answer(b)});

}

async function loadBoard(){
  try{
    const r=await fetch(SB+"/rest/v1/scores?select=player,score,created_at&game=eq.anime-trivia&order=score.desc,created_at.asc&limit=100",{headers:{apikey:KEY}});
    const rows=await r.json();
    if(!Array.isArray(rows))throw new Error("rows");
    const seen=new Set(),top=[];
    for(const x of rows){if(!seen.has(x.player)){seen.add(x.player);top.push(x)}if(top.length===10)break}
    $("lb").innerHTML=top.length?top.map((x,i)=>`<div class="lbrow"><span class="rk">${i+1}</span><span class="nm">${esc(x.player)}</span><span class="pt">${esc(x.score)}</span></div>`).join(""):'<p class="sub">No scores yet. Be the first on the board.</p>';

}
