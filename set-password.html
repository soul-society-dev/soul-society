<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Set your password – Soul Society</title>
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0A0C16;color:#E9ECF5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:440px;margin:0 auto;padding:40px 18px}
h1{font-family:Georgia,serif;font-size:1.5rem;margin:0 0 6px;color:#D9A441}
p{color:#A0A7C4;margin:0 0 18px}
input,button{font:inherit;width:100%}
input{padding:12px;margin-bottom:10px;background:#131728;color:#E9ECF5;border:1px solid #262B45}
button{cursor:pointer;border:0;padding:12px;font-weight:700;background:#D9A441;color:#12152A;border-radius:2px}
button:disabled{opacity:.6}
#msg{margin-top:14px;min-height:1.5em;color:#D9A441}
a{color:#5AB7FF}
</style>
</head>
<body>
<div class="wrap">
  <h1>Set your password</h1>
  <p>Choose a password for your Soul Society account. Use at least 10 characters.</p>
  <form id="f" hidden>
    <input id="p1" type="password" minlength="10" required placeholder="New password" autocomplete="new-password" aria-label="New password">
    <input id="p2" type="password" minlength="10" required placeholder="Repeat password" autocomplete="new-password" aria-label="Repeat password">
    <button type="submit">Save password</button>
  </form>
  <div id="msg" role="status"></div>
</div>
<script>
const SB="https://fehrldvrjgbkuqgrhjmg.supabase.co",KEY="sb_publishable_ihQ-c89K2hsj1w0bwDh8fA_67q3EIzP";
const h=new URLSearchParams(location.hash.replace(/^#/,""));
const tok=h.get("access_token"),err=h.get("error_description");
try{history.replaceState(null,"",location.pathname)}catch(e){}
const msg=t=>{document.getElementById("msg").textContent=t};
if(tok){document.getElementById("f").hidden=false}
else if(err){msg("This link is not valid or has expired. Ask the person who invited you to send a new invitation.")}
else{msg("Open this page from the link in your invitation email.")}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const a=document.getElementById("p1").value,b=document.getElementById("p2").value;
  if(a!==b){msg("The two passwords don\u2019t match.");return}
  if(a.length<10){msg("Use at least 10 characters.");return}
  const btn=e.target.querySelector("button");btn.disabled=true;msg("Saving\u2026");
  try{
    const r=await fetch(SB+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({password:a})});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.msg||d.message||r.status)}
    e.target.hidden=true;
    document.getElementById("msg").innerHTML='Password saved. You can now sign in: <a href="member.html">member area</a> or <a href="admin.html">admin page</a>.';
  }catch(x){msg("Could not save the password. "+(x.message&&isNaN(x.message)?x.message:"Try again, or ask for a new invitation."));btn.disabled=false}
});
</script>
</body>
</html>
