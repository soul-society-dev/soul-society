<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Soul Society Admin</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0A0C16;color:#E9ECF5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Georgia,serif;font-size:1.5rem;margin:0 0 4px;color:#D9A441}
.sub{color:#A0A7C4;margin:0 0 20px}
input,button{font:inherit}
input{width:100%;padding:12px;margin-bottom:10px;background:#131728;color:#E9ECF5;border:1px solid #262B45}
button{cursor:pointer;border:0;padding:10px 16px;font-weight:700;border-radius:2px}
.gold{background:#D9A441;color:#12152A}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab{background:#131728;color:#E9ECF5;border:1px solid #262B45}
.tab[aria-pressed="true"]{border-color:#5AB7FF;color:#5AB7FF}
.out{margin-left:auto;background:transparent;color:#A0A7C4;border:1px solid #262B45}
.c{background:#131728;border:1px solid #262B45;padding:16px;margin-bottom:12px}
.c h2{font-size:1.05rem;margin:0}
.m{color:#A0A7C4;font-size:.9rem;margin:2px 0}
.note{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.warn{color:#FF8A8F;font-weight:700;font-size:.9rem}
.st{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid #A0A7C4;color:#A0A7C4;margin-left:6px}
.st.approved{color:#7BD88F;border-color:#7BD88F}.st.rejected{color:#FF8A8F;border-color:#FF8A8F}
.act{display:flex;gap:8px;margin-top:10px}
.ok{background:#2E7D4F;color:#fff}.no{background:#8A2A33;color:#fff}.undo{background:#262B45;color:#E9ECF5}
#msg{color:#D9A441;min-height:1.4em;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Soul Society Admin</h1>
  <p class="sub">Review membership applications. Admins only.</p>

  <form id="login">
    <input id="em" type="email" required placeholder="Admin email" autocomplete="username" aria-label="Admin email">
    <input id="pw" type="password" required placeholder="Password" autocomplete="current-password" aria-label="Password">
    <button class="gold" type="submit">Sign in</button>
  </form>

  <div id="app" hidden>
    <div class="bar" id="tabs">
      <button class="tab" data-f="pending" aria-pressed="true">Pending</button>
      <button class="tab" data-f="approved" aria-pressed="false">Approved</button>
      <button class="tab" data-f="rejected" aria-pressed="false">Rejected</button>
      <button class="tab" data-f="all" aria-pressed="false">All</button>
      <button class="out" id="out" type="button">Sign out</button>
    </div>
    <div id="list" aria-live="polite"></div>
  </div>
  <div id="msg" role="status"></div>
</div>

<script>
const SB="https://fehrldvrjgbkuqgrhjmg.supabase.co",KEY="sb_publishable_ihQ-c89K2hsj1w0bwDh8fA_67q3EIzP";
let tok=null,rows=[],flt="pending";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=t=>{$("msg").textContent=t};
const hdr=()=>({apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"});

function signOut(note){
  tok=null;rows=[];$("app").hidden=true;$("login").hidden=false;msg(note||"");
}
$("out").onclick=()=>signOut("Signed out.");

$("login").addEventListener("submit",async e=>{
  e.preventDefault();msg("Signing in…");
  try{
    const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
    const d=await r.json();
    if(!r.ok||!d.access_token)throw new Error("login");
    tok=d.access_token;$("pw").value="";
    const a=await fetch(SB+"/rest/v1/admins?select=user_id",{headers:hdr()});
    const ad=await a.json();
    if(!Array.isArray(ad)||!ad.length){signOut("This account is not an admin.");return}
    $("login").hidden=true;$("app").hidden=false;msg("");load();
  }catch(err){msg("Sign-in failed. Check your email and password.")}
});

async function load(){
  $("list").innerHTML='<p class="m">Loading…</p>';
  try{
    const r=await fetch(SB+"/rest/v1/applications?select=*&order=created_at.desc",{headers:hdr()});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    rows=await r.json();draw();
  }catch(err){$("list").innerHTML='<p class="m">Could not load applications. Check your connection.</p>'}
}

function draw(){
  document.querySelectorAll(".tab").forEach(b=>{
    const f=b.dataset.f,n=rows.filter(x=>f==="all"||x.status===f).length;
    b.textContent=f[0].toUpperCase()+f.slice(1)+" ("+n+")";
    b.setAttribute("aria-pressed",String(f===flt));
  });
  const v=rows.filter(x=>flt==="all"||x.status===flt);
  $("list").innerHTML=v.length?v.map(x=>{
    const soc=(x.societies||[]).join(", ")||"None selected";
    const flag=(x.societies||[]).includes("Hentai Paradise")&&!x.is_adult?'<div class="warn">Applied to the 18+ society without confirming age.</div>':"";
    const btns=x.status==="pending"
      ?`<button class="ok" data-id="${esc(x.id)}" data-s="approved">Approve</button><button class="no" data-id="${esc(x.id)}" data-s="rejected">Reject</button>`
      :`<button class="undo" data-id="${esc(x.id)}" data-s="pending">Move back to pending</button>`;
    return `<div class="c"><h2>${esc(x.full_name)}<span class="st ${esc(x.status)}">${esc(x.status)}</span></h2>
      <div class="m">${esc(x.email)}</div>
      <div class="m">Societies: ${esc(soc)}</div>
      <div class="m">18 or older: ${x.is_adult?"Yes":"No"} · Applied ${esc(new Date(x.created_at).toLocaleDateString())}</div>
      ${flag}${x.note?`<div class="note">${esc(x.note)}</div>`:""}
      <div class="act">${btns}</div></div>`}).join(""):'<p class="m">Nothing here.</p>';
}

$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){flt=b.dataset.f;draw()}});
$("list").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  b.disabled=true;
  try{
    const r=await fetch(SB+"/rest/v1/applications?id=eq."+encodeURIComponent(b.dataset.id),{method:"PATCH",headers:{...hdr(),Prefer:"return=minimal"},body:JSON.stringify({status:b.dataset.s})});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    if(!r.ok)throw new Error(r.status);
    rows.find(x=>x.id===b.dataset.id).status=b.dataset.s;msg("");draw();
  }catch(err){msg("Could not update that application. Try again.");b.disabled=false}
});
</script>
</body>
</html>
