<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SS Admin">
<meta name="theme-color" content="#0A0C16">
<title>Soul Society Admin</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#0A0C16;color:#E9ECF5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:Georgia,serif;font-size:1.5rem;margin:0 0 4px;color:#D9A441}
.sub{color:#A0A7C4;margin:0 0 20px}
input,button{font:inherit}
input{width:100%;padding:12px;margin-bottom:10px;background:#131728;color:#E9ECF5;border:1px solid #262B45}
button{cursor:pointer;border:0;padding:10px 16px;font-weight:700;border-radius:2px}
.gold{background:#D9A441;color:#12152A}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tab{background:#131728;color:#E9ECF5;border:1px solid #262B45}
.tab[aria-pressed="true"]{border-color:#5AB7FF;color:#5AB7FF}
.out{margin-left:auto;background:transparent;color:#A0A7C4;border:1px solid #262B45}
.c{background:#131728;border:1px solid #262B45;padding:16px;margin-bottom:12px}
.c h2{font-size:1.05rem;margin:0}
.m{color:#A0A7C4;font-size:.9rem;margin:2px 0}
.note{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.warn{color:#FF8A8F;font-weight:700;font-size:.9rem}
.st{display:inline-block;font-size:.8rem;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid #A0A7C4;color:#A0A7C4;margin-left:6px}
.st.approved{color:#7BD88F;border-color:#7BD88F}.st.rejected{color:#FF8A8F;border-color:#FF8A8F}
.act{display:flex;gap:8px;margin-top:10px}
.ok{background:#2E7D4F;color:#fff}.no{background:#8A2A33;color:#fff}.undo{background:#262B45;color:#E9ECF5}
.rem{display:flex;gap:8px;align-items:center;margin:0 0 12px;color:#A0A7C4;font-size:.9rem}.rem input{width:auto;margin:0}
.vtab{background:#131728;color:#E9ECF5;border:1px solid #262B45}.vtab[aria-pressed="true"]{border-color:#D9A441;color:#D9A441}
select,textarea{width:100%;padding:12px;margin-bottom:10px;background:#131728;color:#E9ECF5;border:1px solid #262B45;font:inherit}textarea{min-height:80px}
#af,#ef{margin-top:16px}
#msg{color:#D9A441;min-height:1.4em;margin-top:8px}
.chk{display:flex;gap:10px;align-items:center;margin:2px 0 14px;color:#A0A7C4}.chk input{width:auto;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Soul Society Admin</h1>
  <p class="sub">Review membership applications. Admins only.</p>

  <form id="login">
    <input id="em" type="email" required placeholder="Admin email" autocomplete="username" aria-label="Admin email">
    <input id="pw" type="password" required placeholder="Password" autocomplete="current-password" aria-label="Password">
    <label class="chk"><input id="keep" type="checkbox" checked> Keep me signed in on this phone</label>
    <label class="rem"><input id="rm" type="checkbox" checked> Keep me signed in on this device</label>
    <button class="gold" type="submit">Sign in</button>
  </form>

  <div id="app" hidden>
    <div class="bar" id="views">
      <button class="vtab" data-v="apps" type="button" aria-pressed="true">Applications</button>
      <button class="vtab" data-v="mems" type="button" aria-pressed="false">Members</button>
      <button class="vtab" data-v="cont" type="button" aria-pressed="false">Content</button>
      <button class="vtab" data-v="mod" type="button" aria-pressed="false">Moderation</button>
      <button class="vtab" data-v="qs" type="button" aria-pressed="false">Questions</button>
      <button class="vtab" data-v="k" type="button" aria-pressed="false">Karaoke</button>
      <button class="vtab" data-v="sp" type="button" aria-pressed="false">Soul Points</button>
      <button class="out" id="out" type="button">Sign out</button>
    </div>
    <div id="appsView">
    <div class="bar" id="tabs">
      <button class="tab" data-f="pending" aria-pressed="true">Pending</button>
      <button class="tab" data-f="approved" aria-pressed="false">Approved</button>
      <button class="tab" data-f="rejected" aria-pressed="false">Rejected</button>
      <button class="tab" data-f="all" aria-pressed="false">All</button>
          </div>
    <div id="list" aria-live="polite"></div>
    </div>
    <div id="memsView" hidden><div id="mlist" aria-live="polite"></div></div>
    <div id="kView" hidden>
      <div class="m" id="kmsg" role="status" style="color:#D9A441;font-weight:700;min-height:1.4em"></div>
      <form class="c" id="kf">
        <h2>New karaoke session</h2>
        <input id="kt" required maxlength="80" placeholder="Title (for example: Anime openings night)" aria-label="Title">
        <input id="kh" maxlength="120" placeholder="Theme (optional)" aria-label="Theme">
        <input id="kd" type="datetime-local" required aria-label="Date and time">
        <input id="kl" type="url" maxlength="300" placeholder="Voice room link (optional, starts with https://)" aria-label="Voice room link">
        <button class="gold" type="submit">Add session</button>
      </form>
      <div id="klist"></div>
    </div>
    <div id="spView" hidden>
      <div class="m" id="smsg" role="status" style="color:#D9A441;font-weight:700;min-height:1.4em"></div>
      <form class="c" id="sf">
        <h2>Award or deduct Soul Points</h2>
        <select id="sm" required aria-label="Member"></select>
        <input id="sa" type="number" required min="-1000" max="1000" step="1" placeholder="Amount (use a minus sign to deduct)" aria-label="Amount">
        <input id="sy" maxlength="120" placeholder="Reason (the member sees this)" aria-label="Reason">
        <button class="gold" type="submit">Apply</button>
      </form>
      <h2 style="margin:20px 0 10px;font-family:Georgia,serif">Earning rules</h2>
      <div id="srules"></div>
      <h2 style="margin:20px 0 10px;font-family:Georgia,serif">Recent activity</h2>
      <div id="slist"></div>
    </div>
    <div id="qsView" hidden>
      <div class="m" id="qmsg" role="status" style="color:#D9A441;font-weight:700;min-height:1.4em"></div>
      <form class="c" id="qf">
        <h2>New trivia question</h2>
        <input id="qq" required maxlength="200" placeholder="Question" aria-label="Question">
        <input id="qa" required maxlength="80" placeholder="Option A" aria-label="Option A">
        <input id="qb" required maxlength="80" placeholder="Option B" aria-label="Option B">
        <input id="qc" required maxlength="80" placeholder="Option C" aria-label="Option C">
        <input id="qd" required maxlength="80" placeholder="Option D" aria-label="Option D">
        <select id="qr" aria-label="Correct answer"><option value="0">Correct answer: A</option><option value="1">Correct answer: B</option><option value="2">Correct answer: C</option><option value="3">Correct answer: D</option></select>
        <button class="gold" type="submit">Add question</button>
      </form>
      <div id="qlist"></div>
    </div>
    <div id="modView" hidden>
      <div class="m" id="mmsg" role="status" style="color:#D9A441;font-weight:700;min-height:1.4em"></div>
      <h2 style="margin:12px 0 10px;font-family:Georgia,serif">Reported posts</h2>
      <div id="rlist"></div>
      <h2 style="margin:24px 0 10px;font-family:Georgia,serif">Recent posts</h2>
      <div id="plist"></div>
    </div>
    <div id="contView" hidden>
      <div class="m" id="cmsg" role="status" style="color:#D9A441;font-weight:700;min-height:1.4em"></div>
      <form class="c" id="af">
        <h2>New announcement</h2>
        <input id="at" required maxlength="90" placeholder="Title" aria-label="Announcement title">
        <textarea id="ab" maxlength="300" placeholder="Message (optional)" aria-label="Message"></textarea>
        <select id="as" aria-label="Society"></select>
        <button class="gold" type="submit">Publish announcement</button>
      </form>
      <div id="alist"></div>
      <form class="c" id="ef">
        <h2>New event</h2>
        <input id="et" required maxlength="90" placeholder="Event title" aria-label="Event title">
        <input id="ed" type="date" required aria-label="Event date">
        <select id="es" aria-label="Society"></select>
        <textarea id="ex" maxlength="200" placeholder="Details (optional)" aria-label="Details"></textarea>
        <button class="gold" type="submit">Publish event</button>
      </form>
      <div id="elist"></div>
    </div>
  </div>
  <div id="msg" role="status"></div>
</div>

<script>
const SB="https://fehrldvrjgbkuqgrhjmg.supabase.co",KEY="sb_publishable_ihQ-c89K2hsj1w0bwDh8fA_67q3EIzP",SK="ss-admin";
let tok=null,rows=[],flt="pending",keep=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg=t=>{$("msg").textContent=t};
const hdr=()=>({apikey:KEY,Authorization:"Bearer "+tok,"Content-Type":"application/json"});
const store=d=>{if(!keep)return;try{localStorage.setItem(SK,JSON.stringify({rt:d.refresh_token}))}catch(e){}};
const unstore=()=>{try{localStorage.removeItem(SK)}catch(e){}};

async function token(body,grant){
  const r=await fetch(SB+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok||!d.access_token)throw new Error("auth");
  tok=d.access_token;store(d);
}
async function refresh(){
  let rt=null;
  try{const s=JSON.parse(localStorage.getItem(SK)||"null");rt=s&&s.rt}catch(e){}
  if(!rt)return false;
  keep=true;
  try{await token({refresh_token:rt},"refresh_token");return true}catch(e){unstore();return false}
}
async function api(url,opt){
  const go=()=>fetch(url,{...(opt||{}),headers:{...hdr(),...((opt&&opt.headers)||{})}});
  let r=await go();
  if(r.status===401&&await refresh())r=await go();
  return r;
}
function signOut(note){
  tok=null;rows=[];keep=false;unstore();
  $("app").hidden=true;$("login").hidden=false;msg(note||"");
}
async function enter(){
  const a=await api(SB+"/rest/v1/admins?select=user_id");
  const ad=await a.json();
  if(!Array.isArray(ad)||!ad.length){signOut("This account is not an admin.");return}
  $("login").hidden=true;$("app").hidden=false;msg("");load();
}
$("out").onclick=()=>signOut("Signed out.");

$("login").addEventListener("submit",async e=>{
  e.preventDefault();msg("Signing in…");
  keep=$("rm").checked;
  try{
    await token({email:$("em").value.trim(),password:$("pw").value},"password");
    $("pw").value="";await enter();
  }catch(err){msg("Sign-in failed. Check your email and password.")}
});

async function load(){
  $("list").innerHTML='<p class="m">Loading…</p>';
  try{
    const r=await api(SB+"/rest/v1/applications?select=*&order=created_at.desc");
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    rows=await r.json();draw();
  }catch(err){$("list").innerHTML='<p class="m">Could not load applications. Check your connection.</p>'}
}

function draw(){
  document.querySelectorAll(".tab").forEach(b=>{
    const f=b.dataset.f,n=rows.filter(x=>f==="all"||x.status===f).length;
    b.textContent=f[0].toUpperCase()+f.slice(1)+" ("+n+")";
    b.setAttribute("aria-pressed",String(f===flt));
  });
  const v=rows.filter(x=>flt==="all"||x.status===flt);
  $("list").innerHTML=v.length?v.map(x=>{
    const soc=(x.societies||[]).join(", ")||"None selected";
    const flag=(x.societies||[]).includes("Hentai Paradise")&&!x.is_adult?'<div class="warn">Applied to the 18+ society without confirming age.</div>':"";
    const btns=x.status==="pending"
      ?`<button class="ok" data-id="${esc(x.id)}" data-s="approved">Approve</button><button class="no" data-id="${esc(x.id)}" data-s="rejected">Reject</button>`
      :`<button class="undo" data-id="${esc(x.id)}" data-s="pending">Move back to pending</button>`;
    return `<div class="c"><h2>${esc(x.full_name)}<span class="st ${esc(x.status)}">${esc(x.status)}</span></h2>
      <div class="m">${esc(x.email)}</div>
      <div class="m">Societies: ${esc(soc)}</div>
      <div class="m">18 or older: ${x.is_adult?"Yes":"No"} · Applied ${esc(new Date(x.created_at).toLocaleDateString())}</div>
      ${flag}${x.note?`<div class="note">${esc(x.note)}</div>`:""}
      <div class="act">${btns}</div></div>`}).join(""):'<p class="m">Nothing here.</p>';
}

$("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b){flt=b.dataset.f;draw()}});
$("list").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  b.disabled=true;
  try{
    const r=await api(SB+"/rest/v1/applications?id=eq."+encodeURIComponent(b.dataset.id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:b.dataset.s})});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    if(!r.ok)throw new Error(r.status);
    rows.find(x=>x.id===b.dataset.id).status=b.dataset.s;msg("");draw();
  }catch(err){msg("Could not update that application. Try again.");b.disabled=false}
});

let mems=[];
async function loadMembers(){
  $("mlist").innerHTML='<p class="m">Loading…</p>';
  try{
    const r=await api(SB+"/rest/v1/members?select=*&order=created_at.desc");
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    mems=await r.json();drawMembers();
  }catch(err){$("mlist").innerHTML='<p class="m">Could not load members. Check your connection.</p>'}
}
function drawMembers(){
  $("mlist").innerHTML=mems.length
    ?'<p class="m">'+mems.length+(mems.length===1?" member":" members")+'</p>'+mems.map(x=>`<div class="c"><h2>${esc(x.username||"(no username yet)")}</h2>
      <div class="m">${esc(x.email)}</div>
      <div class="m">Societies: ${esc((x.societies||[]).join(", ")||"None")}</div>
      <div class="m">Joined ${esc(new Date(x.created_at).toLocaleDateString())}</div>
      ${x.bio?`<div class="note">${esc(x.bio)}</div>`:""}</div>`).join("")
    :'<p class="m">No members yet. They appear here once an approved person creates an account.</p>';
}
$("views").addEventListener("click",e=>{
  const b=e.target.closest(".vtab");if(!b)return;
  const v=b.dataset.v;
  $("appsView").hidden=v!=="apps";$("memsView").hidden=v!=="mems";$("contView").hidden=v!=="cont";$("modView").hidden=v!=="mod";$("qsView").hidden=v!=="qs";$("spView").hidden=v!=="sp";$("kView").hidden=v!=="k";
  document.querySelectorAll(".vtab").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  if(v==="mems")loadMembers();
  if(v==="cont")loadContent();
  if(v==="mod")loadMod();
  if(v==="qs")loadQs();
  if(v==="sp")loadSPAdmin();
  if(v==="k")loadK();
});

/* announcements and events */
const SOC=["Anime Hub","Gamers Society","CineRealm","NovelUp Book Club","SS Battle Ground","Music Society","MMM Society"];
const opts='<option value="">All societies</option>'+SOC.map(s=>`<option>${esc(s)}</option>`).join("");
$("as").innerHTML=opts;$("es").innerHTML=opts;
const cm=t=>{$("cmsg").textContent=t};
const fdate=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
async function loadContent(){
  try{
    const [ra,re]=await Promise.all([api(SB+"/rest/v1/announcements?select=*&order=created_at.desc"),api(SB+"/rest/v1/events?select=*&order=event_date.asc")]);
    if(ra.status===401||re.status===401){signOut("Your session expired. Sign in again.");return}
    const an=await ra.json(),ev=await re.json();
    $("alist").innerHTML=(Array.isArray(an)&&an.length)?an.map(x=>`<div class="c"><h2>${esc(x.title)}</h2><div class="m">${esc(x.society||"All societies")}</div>${x.body?`<div class="note">${esc(x.body)}</div>`:""}<div class="act"><button class="no" data-del="announcements" data-id="${esc(x.id)}">Delete</button></div></div>`).join(""):'<p class="m">No announcements yet.</p>';
    $("elist").innerHTML=(Array.isArray(ev)&&ev.length)?ev.map(x=>`<div class="c"><h2>${esc(x.title)}</h2><div class="m">${esc(fdate(x.event_date))} · ${esc(x.society||"All societies")}</div>${x.details?`<div class="note">${esc(x.details)}</div>`:""}<div class="act"><button class="no" data-del="events" data-id="${esc(x.id)}">Delete</button></div></div>`).join(""):'<p class="m">No events yet.</p>';
  }catch(err){cm("Could not load content. Check your connection.")}
}
async function publish(table,body,form){
  const b=form.querySelector("button");b.disabled=true;cm("Publishing…");
  try{
    const r=await api(SB+"/rest/v1/"+table,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    if(!r.ok)throw new Error(r.status);
    form.reset();cm("Published.");loadContent();
  }catch(err){cm("Could not publish. Try again.")}
  b.disabled=false;
}
$("af").addEventListener("submit",e=>{e.preventDefault();publish("announcements",{title:$("at").value.trim(),body:$("ab").value.trim()||null,society:$("as").value||null},e.target)});
$("ef").addEventListener("submit",e=>{e.preventDefault();publish("events",{title:$("et").value.trim(),event_date:$("ed").value,society:$("es").value||null,details:$("ex").value.trim()||null},e.target)});
$("contView").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-del]");if(!b)return;
  if(!confirm("Delete this? This cannot be undone."))return;
  b.disabled=true;
  try{
    const r=await api(SB+"/rest/v1/"+b.dataset.del+"?id=eq."+encodeURIComponent(b.dataset.id),{method:"DELETE"});
    if(!r.ok)throw new Error(r.status);
    cm("Deleted.");loadContent();
  }catch(err){cm("Could not delete. Try again.");b.disabled=false}
});

/* karaoke */
const km=t=>{$("kmsg").textContent=t};
const kwhen=i=>new Date(i).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
async function loadK(){
  try{
    const r=await api(SB+"/rest/v1/karaoke_sessions?select=*&order=starts_at.desc&limit=30");
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    const rows=await r.json();
    $("klist").innerHTML=(Array.isArray(rows)&&rows.length)?rows.map(x=>`<div class="c"><h2>${esc(x.title)}<span class="st">${esc(x.status)}</span></h2><div class="m">${esc(kwhen(x.starts_at))}${x.theme?" · "+esc(x.theme):""}</div>${x.room_link?`<div class="m">Room: ${esc(x.room_link)}</div>`:""}
      <div class="act"><button class="ok" data-ks="${esc(x.id)}" data-s="live">Set live</button><button class="undo" data-ks="${esc(x.id)}" data-s="upcoming">Upcoming</button><button class="undo" data-ks="${esc(x.id)}" data-s="done">Mark done</button></div>
      <div class="act"><button class="undo" data-kq="${esc(x.id)}">Song queue</button><button class="no" data-kdel="${esc(x.id)}">Delete</button></div>
      <div id="kq-${esc(x.id)}"></div></div>`).join(""):'<p class="m">No sessions yet.</p>';
  }catch(err){km("Could not load sessions. Check your connection.")}
}
async function loadKQ(id){
  const box=document.getElementById("kq-"+id);if(!box)return;
  try{
    const r=await api(SB+"/rest/v1/song_requests?select=*&session_id=eq."+encodeURIComponent(id)+"&order=created_at.asc");
    const rows=await r.json();
    box.innerHTML=(Array.isArray(rows)&&rows.length)?rows.map(x=>`<div class="note"><b>${esc(x.song)}</b>${x.artist?" – "+esc(x.artist):""}<div class="m">${esc(x.requester)} · ${esc(x.status)}</div><div class="act"><button class="ok" data-rs="${esc(x.id)}" data-s="performing" data-sid="${esc(id)}">Singing</button><button class="undo" data-rs="${esc(x.id)}" data-s="done" data-sid="${esc(id)}">Done</button><button class="undo" data-rs="${esc(x.id)}" data-s="skipped" data-sid="${esc(id)}">Skip</button><button class="no" data-rdel="${esc(x.id)}" data-sid="${esc(id)}">Remove</button></div></div>`).join(""):'<p class="m">No requests yet.</p>';
  }catch(err){box.innerHTML='<p class="m">Could not load the queue.</p>'}
}
$("kf").addEventListener("submit",async e=>{
  e.preventDefault();
  const link=$("kl").value.trim();
  if(link&&!/^https?:\/\//i.test(link)){km("The voice room link must start with https://");return}
  const b=e.target.querySelector("button");b.disabled=true;km("Adding…");
  try{
    const r=await api(SB+"/rest/v1/karaoke_sessions",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:$("kt").value.trim(),theme:$("kh").value.trim()||null,starts_at:new Date($("kd").value).toISOString(),room_link:link||null})});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    if(!r.ok)throw new Error(r.status);
    e.target.reset();km("Session added.");loadK();
  }catch(err){km("Could not add the session. Check every box.")}
  b.disabled=false;
});
$("kView").addEventListener("click",async e=>{
  const s=e.target.closest("button[data-ks]"),q=e.target.closest("button[data-kq]"),d=e.target.closest("button[data-kdel]"),rs=e.target.closest("button[data-rs]"),rd=e.target.closest("button[data-rdel]");
  const b=s||q||d||rs||rd;if(!b)return;
  try{
    if(q){loadKQ(q.dataset.kq);return}
    if((d||rd)&&!confirm("Delete this? This cannot be undone."))return;
    b.disabled=true;
    let r;
    if(s)r=await api(SB+"/rest/v1/karaoke_sessions?id=eq."+encodeURIComponent(s.dataset.ks),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:s.dataset.s})});
    else if(d)r=await api(SB+"/rest/v1/karaoke_sessions?id=eq."+encodeURIComponent(d.dataset.kdel),{method:"DELETE"});
    else if(rs)r=await api(SB+"/rest/v1/song_requests?id=eq."+encodeURIComponent(rs.dataset.rs),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:rs.dataset.s})});
    else r=await api(SB+"/rest/v1/song_requests?id=eq."+encodeURIComponent(rd.dataset.rdel),{method:"DELETE"});
    if(!r.ok)throw new Error(r.status);
    km("Done.");
    if(rs||rd)loadKQ((rs||rd).dataset.sid);else loadK();
  }catch(err){km("Could not complete that. Try again.");b.disabled=false}
});

/* Soul Points */
const sm_=t=>{$("smsg").textContent=t};
async function loadSPAdmin(){
  try{
    const [rm,rr,rl]=await Promise.all([api(SB+"/rest/v1/members?select=user_id,username,email&order=created_at.asc&limit=500"),api(SB+"/rest/v1/sp_rules?select=*&order=game.asc"),api(SB+"/rest/v1/sp_ledger?select=*&order=created_at.desc&limit=60")]);
    if(rm.status===401||rr.status===401||rl.status===401){signOut("Your session expired. Sign in again.");return}
    const ms=await rm.json(),rs=await rr.json(),ls=await rl.json();
    if(!Array.isArray(rs)||!Array.isArray(ls)){sm_("Soul Points tables aren\u2019t set up yet. Run the Soul Points SQL first.");return}
    const nm={};(Array.isArray(ms)?ms:[]).forEach(x=>nm[x.user_id]=x.username||x.email);
    $("sm").innerHTML=(Array.isArray(ms)?ms:[]).map(x=>`<option value="${esc(x.user_id)}">${esc(x.username||x.email)}${x.username?" ("+esc(x.email)+")":""}</option>`).join("");
    $("srules").innerHTML=rs.map(r=>`<div class="c"><h2>${esc(r.game)}</h2><div class="m">SP = base + score \u00f7 divisor, capped per round and per day. Posts and karaoke use the base only.</div>
      <div class="m">Base</div><input data-f="base" data-g="${esc(r.game)}" type="number" min="0" max="100" value="${esc(r.base)}">
      <div class="m">Score divisor</div><input data-f="score_div" data-g="${esc(r.game)}" type="number" min="1" max="10000" value="${esc(r.score_div)}">
      <div class="m">Max per round</div><input data-f="max_round" data-g="${esc(r.game)}" type="number" min="0" max="500" value="${esc(r.max_round)}">
      <div class="m">Max per day</div><input data-f="daily_cap" data-g="${esc(r.game)}" type="number" min="0" max="2000" value="${esc(r.daily_cap)}">
      <div class="act"><button class="ok" data-rsave="${esc(r.game)}">Save rule</button></div></div>`).join("")||'<p class="m">No rules yet.</p>';
    $("slist").innerHTML=ls.length?ls.map(x=>`<div class="c"><h2>${x.amount>0?"+":""}${esc(x.amount)} SP \u00b7 ${esc(nm[x.user_id]||"member")}</h2><div class="m">${esc(x.reason)} \u00b7 ${esc(x.source)} \u00b7 ${esc(new Date(x.created_at).toLocaleString())}</div></div>`).join(""):'<p class="m">No Soul Points activity yet.</p>';
  }catch(err){sm_("Could not load. Check your connection.")}
}
$("sf").addEventListener("submit",async e=>{
  e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;sm_("Applying\u2026");
  try{
    const r=await api(SB+"/rest/v1/rpc/admin_award_sp",{method:"POST",body:JSON.stringify({target:$("sm").value,amt:parseInt($("sa").value,10),why:$("sy").value.trim()})});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    if(!r.ok)throw new Error(r.status);
    $("sa").value="";$("sy").value="";sm_("Done. The member can see it in their history.");loadSPAdmin();
  }catch(err){sm_("Could not apply. Check the amount (1 to 1000, or negative to deduct).")}
  b.disabled=false;
});
$("spView").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-rsave]");if(!b)return;
  const g=b.dataset.rsave,body={};
  document.querySelectorAll('#srules input[data-g="'+g+'"]').forEach(i=>body[i.dataset.f]=parseInt(i.value,10));
  b.disabled=true;
  try{
    const r=await api(SB+"/rest/v1/sp_rules?game=eq."+encodeURIComponent(g),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(r.status);
    sm_("Rule saved.");
  }catch(err){sm_("Could not save the rule. Check the numbers.")}
  b.disabled=false;
});

/* trivia questions */
const qm=t=>{$("qmsg").textContent=t};
async function loadQs(){
  try{
    const r=await api(SB+"/rest/v1/questions?select=*&order=created_at.desc&limit=200");
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    const rows=await r.json();
    $("qlist").innerHTML=(Array.isArray(rows)&&rows.length)
      ?'<p class="m">'+rows.length+' custom '+(rows.length===1?'question':'questions')+'. The built-in questions are always included too.</p>'+rows.map(x=>`<div class="c"><h2>${esc(x.question)}</h2><div class="m">A: ${esc(x.opt_a)} · B: ${esc(x.opt_b)} · C: ${esc(x.opt_c)} · D: ${esc(x.opt_d)}</div><div class="m">Correct: ${"ABCD"[x.answer]}</div><div class="act"><button class="no" data-qdel="${esc(x.id)}">Delete</button></div></div>`).join("")
      :'<p class="m">No custom questions yet. The built-in questions are always included.</p>';
  }catch(err){qm("Could not load questions. Check your connection.")}
}
$("qf").addEventListener("submit",async e=>{
  e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;qm("Adding…");
  try{
    const r=await api(SB+"/rest/v1/questions",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({question:$("qq").value.trim(),opt_a:$("qa").value.trim(),opt_b:$("qb").value.trim(),opt_c:$("qc").value.trim(),opt_d:$("qd").value.trim(),answer:+$("qr").value})});
    if(r.status===401){signOut("Your session expired. Sign in again.");return}
    if(!r.ok)throw new Error(r.status);
    e.target.reset();qm("Question added. It is live in the game.");loadQs();
  }catch(err){qm("Could not add the question. Check every box is filled in.")}
  b.disabled=false;
});
$("qsView").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-qdel]");if(!b)return;
  if(!confirm("Delete this question?"))return;
  b.disabled=true;
  try{
    const r=await api(SB+"/rest/v1/questions?id=eq."+encodeURIComponent(b.dataset.qdel),{method:"DELETE"});
    if(!r.ok)throw new Error(r.status);
    qm("Deleted.");loadQs();
  }catch(err){qm("Could not delete. Try again.");b.disabled=false}
});

/* moderation */
const mm=t=>{$("mmsg").textContent=t};
async function loadMod(){
  try{
    const [rr,rp]=await Promise.all([api(SB+"/rest/v1/reports?select=*,posts(*)&status=eq.open&order=created_at.desc"),api(SB+"/rest/v1/posts?select=*&order=created_at.desc&limit=100")]);
    if(rr.status===401||rp.status===401){signOut("Your session expired. Sign in again.");return}
    const rep=await rr.json(),po=await rp.json();
    $("rlist").innerHTML=(Array.isArray(rep)&&rep.length)?rep.map(x=>{const p=x.posts||{};return `<div class="c"><h2>${esc(p.title||"Reply")}</h2><div class="m">${esc(p.society||"")} · by ${esc(p.author_name||"")}</div><div class="note">${esc(p.body||"(already removed)")}</div><div class="m">Reason: ${esc(x.reason||"none given")}</div><div class="act"><button class="no" data-mdel="${esc(x.post_id)}">Delete post</button><button class="undo" data-dismiss="${esc(x.id)}">Dismiss report</button></div></div>`}).join(""):'<p class="m">No open reports.</p>';
    $("plist").innerHTML=(Array.isArray(po)&&po.length)?po.map(p=>`<div class="c"><h2>${esc(p.title||"Reply")}</h2><div class="m">${esc(p.society)} · ${esc(p.author_name)} · ${esc(new Date(p.created_at).toLocaleDateString())}</div><div class="note">${esc(p.body)}</div><div class="act"><button class="no" data-mdel="${esc(p.id)}">Delete</button></div></div>`).join(""):'<p class="m">No posts yet.</p>';
  }catch(err){mm("Could not load. Check your connection.")}
}
$("modView").addEventListener("click",async e=>{
  const d=e.target.closest("button[data-mdel]"),r=e.target.closest("button[data-dismiss]");
  if(!d&&!r)return;
  if(d&&!confirm("Delete this post? This cannot be undone."))return;
  const b=d||r;b.disabled=true;
  try{
    const res=d?await api(SB+"/rest/v1/posts?id=eq."+encodeURIComponent(d.dataset.mdel),{method:"DELETE"})
              :await api(SB+"/rest/v1/reports?id=eq."+encodeURIComponent(r.dataset.dismiss),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:"resolved"})});
    if(!res.ok)throw new Error(res.status);
    mm(d?"Post deleted.":"Report dismissed.");loadMod();
  }catch(err){mm("Could not complete that. Try again.");b.disabled=false}
});

(async()=>{
  msg("Checking your session…");
  try{if(await refresh()){await enter();return}}catch(e){}
  msg("");
})();
</script>
