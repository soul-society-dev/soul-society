<style>
:root{color-scheme:dark;--bg:#0A0C16;--ink:#E9ECF5;--card:#131728;--muted:#A0A7C4;--line:#262B45;--c:#1E7FCB;--cg:30,127,203;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C16;--ink:#E9ECF5;--card:#131728;--muted:#A0A7C4;--line:#262B45}}
:root[data-theme="dark"]{--bg:#0A0C16;--ink:#E9ECF5;--card:#131728;--muted:#A0A7C4;--line:#262B45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;line-height:1.15;margin:0}
a{color:inherit}:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.top{background:#0A0C16;color:#E9ECF5;border-bottom:1px solid #262B45}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px;gap:12px}
.logo{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;font-size:1.05rem;text-decoration:none;letter-spacing:.08em}
.top a.back{color:#A0A7C4;text-decoration:none;font-size:.92rem}
.head{position:relative;overflow:hidden;background:radial-gradient(110% 150% at 88% 0%,rgba(var(--cg),.26),transparent 62%),#0A0C16;color:#E9ECF5;border-bottom:6px solid var(--c);padding:44px 0 38px}.head>.wrap{position:relative;z-index:2}.scene{position:absolute;inset:0;color:var(--c);pointer-events:none}.scene svg{display:block;width:100%;height:100%}
.head h1{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;font-size:clamp(1.8rem,7vw,3.2rem);letter-spacing:.04em;margin-bottom:8px}
.head p{color:#C9CFE3;margin:0 0 18px;max-width:34em}
.btn{display:inline-block;font:inherit;font-weight:700;background:var(--c);color:#12152A;padding:12px 22px;text-decoration:none;border-radius:2px}
.btn:hover{filter:brightness(1.1)}
.note{background:var(--card);border:1px dashed var(--line);padding:10px 14px;margin:22px 0;color:var(--muted);font-size:.92rem}
.intro{font-size:1.05rem;max-width:42em;margin:26px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:48px}
.box{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);padding:18px}
.box h2{font-size:1.1rem;margin-bottom:10px}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.box li{color:var(--muted);font-size:.95rem;padding-left:12px;border-left:3px solid var(--line)}
.gate{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);padding:22px;margin:30px 0 48px}
.gate h2{margin-bottom:10px}.gate ul{color:var(--muted);padding-left:20px}
footer{padding:0 18px 36px;text-align:center;color:var(--muted);font-size:.85rem}
.battle{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);padding:22px;margin:0 0 28px}
.battle .meta{color:var(--muted);margin:6px 0 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:16px 0}
.vs button{font:inherit;font-weight:700;padding:14px 8px;background:var(--bg);color:var(--ink);border:2px solid var(--line);cursor:pointer}
.vs button:hover,.vs button[aria-pressed="true"]{border-color:var(--c)}
.vs i{font-style:normal;font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;color:#C8323C}
.vs svg{display:block;width:72px;height:72px;margin:0 auto 6px;transition:transform .25s}
.vs button:hover svg,.vs button[aria-pressed="true"] svg{transform:scale(1.12)}
#bva svg{color:#5AB7FF}#bvb svg{color:#C8323C}
.vs button[aria-pressed="true"] svg{filter:drop-shadow(0 0 8px currentColor)}
.bar{display:flex;height:26px;border:1px solid var(--line);overflow:hidden;font-size:.8rem;font-weight:700;color:#fff}
.bar span{display:flex;align-items:center;padding:0 8px;white-space:nowrap;transition:width .4s}
.bar .a{background:#1E7FCB}.bar .b{background:#C8323C;justify-content:flex-end}
@media (max-width:640px){.vs{grid-template-columns:1fr}.vs i{text-align:center}}
@media (prefers-reduced-motion:reduce){.vs svg,.bar span{transition:none}}
.disc{margin:0 0 40px}.disc h2{margin-bottom:14px}
.th{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);padding:16px;margin-bottom:12px}
.th h3{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:2px}
.th .by{color:var(--muted);font-size:.85rem}.th p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.th details{margin-top:8px}.th summary{cursor:pointer;color:var(--muted);font-size:.92rem}
.rp{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0}
.dform input,.dform textarea{display:block;width:100%;font:inherit;padding:11px;margin-bottom:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.dform textarea{min-height:70px}.dform .btn{border:0;cursor:pointer}
.sm{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:.85rem;text-decoration:underline;padding:0}
.hemb{width:72px;height:72px;color:var(--c);margin-bottom:10px}.hemb svg{width:100%;height:100%;display:block}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--c);color:#0A0C16;font-weight:800;font-size:.9rem;flex:none}.av.big{width:64px;height:64px;font-size:1.6rem}
.th .by{display:flex;gap:8px;align-items:center}
/* WARM SEIREITEI THEME START */
:root:root:root{--bg:#0B0B1E;--ink:#F1EBFA;--card:rgba(26,21,52,.62);--muted:#ADA7CC;--line:rgba(185,166,255,.2);--blue:#B9A6FF;--gold:#E8B65C;--red:#FF7A8A;color-scheme:dark}
body{background:radial-gradient(1000px 620px at 88% -6%,rgba(232,182,92,.14),transparent 62%),radial-gradient(900px 700px at -4% 34%,rgba(185,166,255,.12),transparent 60%),radial-gradient(800px 600px at 60% 100%,rgba(120,80,170,.14),transparent 60%),#0B0B1E;color:var(--ink)}
.top{background:rgba(11,11,30,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(185,166,255,.16)}
.top nav a:hover,.sn a:hover{color:#E8B65C}
.logo{text-shadow:0 0 18px rgba(232,182,92,.35)}
.hero,.phead{background:linear-gradient(#0B0B1E 0%,#1B1540 48%,#4B3472 80%,#8A5A6E 100%)}
.hero::after,.phead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:48%;background:radial-gradient(70% 100% at 50% 100%,rgba(240,201,122,.30),transparent 70%);pointer-events:none;z-index:1}
.sky .moon{fill:#F8E6B8}
.sky path:nth-of-type(1){fill:#261D52}.sky path:nth-of-type(2){fill:#110D2A}
.spirit{background:#D8C9FF;box-shadow:0 0 12px 3px rgba(185,166,255,.65)}
.hero h1{background:linear-gradient(180deg,#FFF7DE 10%,#F3D083 58%,#DDA845 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 18px rgba(232,182,92,.45))}
.tag{color:#F0C97A}
.btn{background:linear-gradient(135deg,#F6D98B,#DDA845);color:#2A1D05;border-radius:10px;box-shadow:0 8px 22px -8px rgba(232,182,92,.65);transition:transform .2s,box-shadow .2s}
.btn:hover{filter:none;transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(232,182,92,.85)}
.btn.ghost{background:transparent;color:#F1EBFA;border:2px solid rgba(185,166,255,.6);box-shadow:none}
.soc,.ecard,.ev,.fi,.door,.step,.box,.gate,.battle,.th,.tbox,.lbrow,.req,.kf,.pill{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px}
.soc,.ecard,.ev,.fi,.door,.step,.box,.gate,.battle,.th,.tbox,.lbrow,.req,.kf{background:var(--card);border-color:var(--line);box-shadow:0 10px 32px -14px rgba(0,0,0,.6)}
.soc,.ecard,.door,.box,.battle,.tbox,.kf{border-top-width:3px}
.soc,.ecard,.door,.fi{transition:transform .25s,box-shadow .25s,border-color .25s}
.soc:hover,.ecard:hover,.door:hover,.fi:hover{box-shadow:0 16px 40px -12px var(--c,#B9A6FF);border-color:var(--c,#B9A6FF)}
.soc:hover{transform:translateY(-4px)}
.pill{background:rgba(26,21,52,.62)}
.ev .d{color:#F0C97A}
.spot,.cta,.joinbox{background:linear-gradient(160deg,rgba(40,31,78,.92),rgba(18,15,42,.92));border:1px solid rgba(185,166,255,.22);border-radius:20px}
.head{background:radial-gradient(110% 150% at 88% 0%,rgba(var(--cg,185,166,255),.3),transparent 62%),linear-gradient(#0B0B1E,#19143C)}
.opt{border-radius:12px}
.gc{background:rgba(26,21,52,.62);border-color:rgba(185,166,255,.2)}
.drawer{background:rgba(20,16,44,.94)}
.card,.wait{background:rgba(26,21,52,.62);border-color:rgba(185,166,255,.2);border-radius:16px}
main{animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
::selection{background:rgba(232,182,92,.35)}
@media (prefers-reduced-motion:reduce){main{animation:none}.soc,.ecard,.door,.fi,.btn{transition:none}.soc:hover,.ecard:hover,.door:hover,.btn:hover{transform:none}}
/* WARM SEIREITEI THEME END */
</style>
</head>

const SB="https://fehrldvrjgbkuqgrhjmg.supabase.co",KEY="sb_publishable_ihQ-c89K2hsj1w0bwDh8fA_67q3EIzP",SK="ss-member";
let _ses=null;
const getSes=()=>_ses||(_ses=(async()=>{
  try{
    let bucket=localStorage,raw=localStorage.getItem(SK);
    if(!raw){bucket=sessionStorage;raw=sessionStorage.getItem(SK)}
    if(!raw)return null;
    const rt=JSON.parse(raw).rt;if(!rt)return null;
    const tr=await fetch(SB+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})});
    if(!tr.ok)return null;
    const d=await tr.json();
    try{bucket.setItem(SK,JSON.stringify({rt:d.refresh_token}))}catch(e){}
    return d.user&&d.user.id?{tok:d.access_token,uid:d.user.id}:null;
  }catch(e){return null}
})());
const rest=(path,ses,opt)=>fetch(SB+"/rest/v1/"+path,{...(opt||{}),headers:{apikey:KEY,Authorization:"Bearer "+ses.tok,"Content-Type":"application/json",...((opt&&opt.headers)||{})}});
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderScene(id,hex){
  const n=parseInt(hex.slice(1),16);
  document.documentElement.style.setProperty("--cg",[(n>>16)&255,(n>>8)&255,n&255].join(","));
  let seed=7;for(const ch of id)seed=(seed*31+ch.charCodeAt(0))%2147483647||7;
  const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const star=(x,y,r,o)=>`<path d="M${x} ${y-r}Q${x} ${y} ${x+r} ${y}Q${x} ${y} ${x} ${y+r}Q${x} ${y} ${x-r} ${y}Q${x} ${y} ${x} ${y-r}Z" fill="currentColor" opacity="${o}"/>`;
  const kind={"anime-hub":"rays","gamers-society":"pixels","games-arena":"pixels","cinerealm":"film","novelup-book-club":"books","ss-battle-ground":"slash","music-society":"wave","karaoke-lounge":"wave","mmm-society":"panels","hentai-paradise":"rings"}[id]||"rays";
  let g="";
  if(kind==="rays"){
    for(let i=0;i<16;i++){const a1=i/16*Math.PI*1.1,a2=a1+Math.PI/48,L=900;
      g+=`<path d="M1000 10L${(1000+Math.cos(a1)*L).toFixed(0)} ${(10+Math.sin(a1)*L).toFixed(0)}L${(1000+Math.cos(a2)*L).toFixed(0)} ${(10+Math.sin(a2)*L).toFixed(0)}Z" fill="currentColor" opacity=".10"/>`}
    for(let i=0;i<9;i++)g+=star((620+rnd()*540).toFixed(0),(20+rnd()*250).toFixed(0),(6+rnd()*12).toFixed(0),(.35+rnd()*.3).toFixed(2));
  }else if(kind==="pixels"){
    for(let i=0;i<90;i++){const x=Math.floor((560+rnd()*620)/28)*28,y=Math.floor(rnd()*10)*28;
      g+=`<rect x="${x}" y="${y}" width="24" height="24" rx="3" fill="currentColor" opacity="${(.06+rnd()*.2).toFixed(2)}"/>`}
  }else if(kind==="film"){
    g+=`<path d="M980 0L740 300H1200V0Z" fill="currentColor" opacity=".07"/><rect x="500" y="0" width="700" height="42" fill="currentColor" opacity=".08"/><rect x="500" y="258" width="700" height="42" fill="currentColor" opacity=".08"/>`;
    for(let x=520;x<1200;x+=44)g+=`<rect x="${x}" y="14" width="22" height="14" rx="3" fill="currentColor" opacity=".25"/><rect x="${x}" y="272" width="22" height="14" rx="3" fill="currentColor" opacity=".25"/>`;
  }else if(kind==="books"){
    for(let x=560;x<1190;x+=30){const w=20+rnd()*14,h=90+rnd()*130;
      g+=`<rect x="${x}" y="${(300-h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="2" fill="currentColor" opacity="${(.14+rnd()*.2).toFixed(2)}"/><rect x="${x}" y="${(312-h).toFixed(0)}" width="${w.toFixed(0)}" height="4" fill="currentColor" opacity=".35"/>`}
  }else if(kind==="slash"){
    for(let i=0;i<7;i++){const x=640+i*90+rnd()*30;
      g+=`<path d="M${x.toFixed(0)} 300L${(x+170).toFixed(0)} 0H${(x+190).toFixed(0)}L${(x+20).toFixed(0)} 300Z" fill="currentColor" opacity="${(.08+rnd()*.14).toFixed(2)}"/>`}
    for(let i=0;i<10;i++)g+=`<circle cx="${(600+rnd()*580).toFixed(0)}" cy="${(rnd()*280).toFixed(0)}" r="${(2+rnd()*3).toFixed(1)}" fill="currentColor" opacity=".45"/>`;
  }else if(kind==="wave"){
    for(let i=0;i<44;i++){const h=20+(Math.sin(i*.55)+1)*50+rnd()*40;
      g+=`<rect x="${520+i*15}" y="${(300-h).toFixed(0)}" width="9" height="${h.toFixed(0)}" rx="4" fill="currentColor" opacity="${(.18+rnd()*.2).toFixed(2)}"/>`}
  }else if(kind==="panels"){
    g+=`<g fill="none" stroke="currentColor" stroke-width="3" opacity=".28"><rect x="640" y="30" width="250" height="150"/><rect x="910" y="30" width="230" height="110"/><rect x="910" y="160" width="230" height="110"/><rect x="640" y="200" width="250" height="70"/></g>`;
    for(let x=650;x<890;x+=14)for(let y=40;y<180;y+=14)g+=`<circle cx="${x}" cy="${y}" r="2.2" fill="currentColor" opacity=".13"/>`;
  }else{
    for(const r of [60,110,160,210])g+=`<circle cx="1000" cy="150" r="${r}" fill="none" stroke="currentColor" stroke-width="2" opacity=".16"/>`;
  }
  const el=document.getElementById("scene");
  if(el)el.innerHTML=`<svg viewBox="0 0 1200 300" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">${g}</svg>`;
}
const AVC=["#5AB7FF","#7BD88F","#D9A441","#B58CFF","#FF7A59","#FF6FAE","#4DD0C4","#9AA7FF"];
const av=(n,big)=>{n=String(n||"?");let h=0;for(const c of n)h=(h*31+c.codePointAt(0))>>>0;const m=n.match(/[A-Za-z0-9]/);return `<span class="av${big?" big":""}" style="--c:${AVC[h%AVC.length]}" aria-hidden="true">${m?m[0].toUpperCase():"?"}</span>`};
(async()=>{
  const NAMES=["Anime Hub","Hentai Paradise","Gamers Society","CineRealm","NovelUp Book Club","SS Battle Ground","Music Society","MMM Society"];
  if(!s||!NAMES.includes(s[0]))return;
  const live=id!=="hentai-paradise";
  let disc=null;
  if(live){
    const anchor=m.querySelector(".battle")||m.querySelector(".intro");
    anchor.insertAdjacentHTML("afterend",'<section class="disc"><h2>Discussions</h2><div id="dbody"><p class="note" style="margin:0">Loading\u2026</p></div></section>');
    disc=document.getElementById("dbody");
  }
  const ses=await getSes();
  if(!ses){if(disc)disc.innerHTML='<p class="note" style="margin:0">Sign in to read and join the discussions. <a href="member.html">Sign in</a> or <a href="join.html">apply to join</a>.</p>';return}
  let mine=null;
  try{const r=await rest("members?user_id=eq."+encodeURIComponent(ses.uid)+"&select=societies",ses);const rows=await r.json();if(Array.isArray(rows)&&rows[0])mine=rows[0].societies||[]}catch(e){}
  if(!mine){if(disc)disc.innerHTML='<p class="note" style="margin:0">Your account is waiting for approval. Discussions open once an administrator approves your application.</p>';return}

  const jn=document.getElementById("jn");
  const member=()=>{jn.textContent="\u2713 You\u2019re a member";jn.href="member.html";jn.onclick=null};
  let load=()=>{};
  if(mine.includes(s[0]))member();
  else if(live){
    jn.textContent="Join this society";jn.href="#";
    jn.onclick=async e=>{
      e.preventDefault();jn.textContent="Joining\u2026";
      try{
        const p=await rest("members?user_id=eq."+encodeURIComponent(ses.uid),ses,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({societies:[...mine,s[0]]})});
        if(!p.ok)throw new Error(p.status);
        mine.push(s[0]);member();load();
      }catch(err){jn.textContent="Could not join. Try again."}
    };
  }
  if(!live)return;

  /* discussions */
  let openId=null;
  const when=d=>new Date(d).toLocaleDateString();
  load=async()=>{
    let rows=[];
    try{const r=await rest("posts?select=*&society=eq."+encodeURIComponent(s[0])+"&order=created_at.asc&limit=300",ses);rows=await r.json();if(!Array.isArray(rows))rows=[]}
    catch(e){disc.innerHTML='<p class="note" style="margin:0">Could not load discussions.</p>';return}
    const tops=rows.filter(x=>!x.parent_id).reverse(),reps={};
    rows.filter(x=>x.parent_id).forEach(x=>(reps[x.parent_id]=reps[x.parent_id]||[]).push(x));
    const can=mine.includes(s[0]);
    const form=can?'<form class="dform th" id="nf"><h3>Start a discussion</h3><input id="nt" required maxlength="90" placeholder="Title" aria-label="Title"><textarea id="nb" required maxlength="1000" placeholder="What do you want to talk about?" aria-label="Message"></textarea><button class="btn" type="submit">Post</button> <span class="by" id="nm"></span></form>':'<p class="note" style="margin:0 0 14px">Join this society to start discussions and reply.</p>';
    const del=x=>x.author_id===ses.uid?`<button class="sm" type="button" data-del="${esc(x.id)}">Delete</button>`:`<button class="sm" type="button" data-rep="${esc(x.id)}">Report</button>`;
    disc.innerHTML=form+(tops.length?tops.map(t=>{
      const rs=reps[t.id]||[];
      return `<div class="th"><h3>${esc(t.title)}</h3><div class="by">${av(t.author_name)}<span>${esc(t.author_name)} \u00b7 ${esc(when(t.created_at))}</span></div><p>${esc(t.body)}</p>${del(t)}
      <details${t.id===openId?" open":""}><summary>${rs.length} ${rs.length===1?"reply":"replies"}</summary>${rs.map(r=>`<div class="rp"><div class="by">${av(r.author_name)}<span>${esc(r.author_name)} \u00b7 ${esc(when(r.created_at))}</span></div><p>${esc(r.body)}</p>${del(r)}</div>`).join("")}${can?`<form class="dform" data-reply="${esc(t.id)}"><textarea required maxlength="1000" placeholder="Write a reply" aria-label="Reply"></textarea><button class="btn" type="submit">Reply</button></form>`:""}</details></div>`}).join(""):'<p class="note" style="margin:0">No discussions yet. Be the first to start one.</p>');
  };
  disc.addEventListener("submit",async e=>{
    e.preventDefault();const f=e.target,btn=f.querySelector("button");btn.disabled=true;
    try{
      let body;
      if(f.id==="nf")body={society:s[0],title:f.querySelector("#nt").value.trim(),body:f.querySelector("#nb").value.trim()};
      else{openId=f.dataset.reply;body={society:s[0],parent_id:f.dataset.reply,body:f.querySelector("textarea").value.trim()}}
      const r=await rest("posts",ses,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
      if(!r.ok)throw new Error(r.status);
      await load();
    }catch(err){
      const nm=document.getElementById("nm");
      if(f.id==="nf"&&nm)nm.textContent="Could not post. Try again.";else btn.textContent="Could not send. Try again";
      btn.disabled=false;
    }
  });
  disc.addEventListener("click",async e=>{
    const b=e.target.closest("button[data-del]");if(!b)return;
    if(!confirm("Delete this? This cannot be undone."))return;
    try{const r=await rest("posts?id=eq."+encodeURIComponent(b.dataset.del),ses,{method:"DELETE"});if(!r.ok)throw new Error(r.status);await load()}
    catch(err){b.textContent="Could not delete"}
  });
  disc.addEventListener("click",async e=>{
    const b=e.target.closest("button[data-rep]");if(!b)return;
    const why=prompt("Why are you reporting this? (optional)");
    if(why===null)return;
    b.disabled=true;
    try{
      const r=await rest("reports",ses,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({post_id:b.dataset.rep,reporter_id:ses.uid,reason:why.trim().slice(0,300)||null})});
      if(r.status===409){b.textContent="Already reported";return}
      if(!r.ok)throw new Error(r.status);
      b.textContent="Reported. Thank you.";
    }catch(err){b.textContent="Could not report";b.disabled=false}
  });
  await load();
})();
</script>
